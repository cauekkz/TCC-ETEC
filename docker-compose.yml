services:
  db:
    image: mariadb:11.4
    container_name: etecconnect-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: tcc
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/charset.cnf:/etc/mysql/conf.d/charset.cnf:ro,z
      - ./backend/DDL.sql:/docker-entrypoint-initdb.d/01-DDL.sql:ro,z
      - ./backend/DML.sql:/docker-entrypoint-initdb.d/02-DML.sql:ro,z
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro,z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./docker/php
    container_name: etecconnect-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_DBNAME: tcc
      MYSQL_USER: root
      MYSQL_PASS: root
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:z

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: etecconnect-pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"

volumes:
  db_data:
